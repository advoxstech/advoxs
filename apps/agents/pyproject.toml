[project]
name = "api-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "langfuse>=4.9.0",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-postgres>=3.1.0",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/integration/test_prompts.py testa o antigo modelo de especialistas
# fixos (current_specialist/transfer_to_specialist), substituído pelos
# agentes dinâmicos por tenant (ver CLAUDE.md) — e exigiria uma chave real
# da OpenAI, que não existe no CI. Só tests/unit roda por padrão.
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py313"
# tests/integration testa o antigo modelo de especialistas fixos (removido —
# ver testpaths acima), nunca mais executado; excluído do lint por já ser
# código morto, não por relaxar o padrão do resto do serviço.
extend-exclude = ["tests/integration"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
