name: CI

on:
  pull_request:
    branches: [main]

jobs:
  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_production_config.py -v
      - run: python scripts/check_sensitive_logs.py

  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      agents: ${{ steps.filter.outputs.agents }}
      worker: ${{ steps.filter.outputs.worker }}
      api_rag: ${{ steps.filter.outputs.api_rag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
            api:
              - 'apps/api/**'
            agents:
              - 'apps/agents/**'
            worker:
              - 'apps/worker/**'
            api_rag:
              - 'apps/api_rag/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@advoxs/web lint
      - run: pnpm --filter=@advoxs/web test

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: advoxs_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: agent_versions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advoxs_test -d agent_versions_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit
        env:
          DATABASE_URL: postgresql+asyncpg://advoxs:advoxs@localhost:5432/advoxs_test
          # advoxs_app/advoxs_system (RLS/BYPASSRLS, ver migration 0008) — nenhuma
          # role de produção existe no runner. Os testes unitários usam mocks;
          # a etapa seguinte usa seu próprio banco descartável e roles de teste.
          APP_DATABASE_URL: postgresql+asyncpg://advoxs_app:advoxs@localhost:5432/advoxs_test
          SYSTEM_DATABASE_URL: postgresql+asyncpg://advoxs_system:advoxs@localhost:5432/advoxs_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret
      - name: Migrations, response sources, tenant isolation and concurrent publication
        run: uv run pytest tests/integration/test_agent_versions.py tests/integration/test_response_sources.py
        env:
          AGENT_VERSIONS_TEST_DATABASE_URL: postgresql+asyncpg://advoxs_test:test-only@localhost:5432/agent_versions_test

  agents:
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          # advoxs_app (RLS ativo, ver migration 0008 no apps/api) — o worker não
          # roda migrations nem conecta como owner, só consome esse papel.
          APP_DATABASE_URL: postgresql+asyncpg://advoxs_app:advoxs@localhost:5432/advoxs_test
          REDIS_URL: redis://localhost:6379/0

  api_rag:
    needs: changes
    if: needs.changes.outputs.api_rag == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api_rag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/unit
